<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scrollbrella</title>

  <!-- Launch full-screen from the iOS home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scrollbrella">
  <meta name="theme-color" content="#1e2a44">

  <link rel="apple-touch-icon" href="icons/icon-180-v2.png">
  <link rel="icon" type="image/png" href="icons/icon-192-v2.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg viewBox="0 0 200 200" class="splash-logo">
      <defs>
        <g id="hand">
          <rect x="-9" y="0" width="18" height="58" rx="9" fill="var(--text)"/>
          <rect x="-5" y="3" width="10" height="11" rx="4" fill="var(--red)" opacity=".35"/>
          <path d="M-5 26 h10 M-5 38 h10" stroke="var(--red)" stroke-width="2" stroke-linecap="round" opacity=".45"/>
          <rect x="-13" y="44" width="46" height="44" rx="15" fill="var(--text)"/>
          <path d="M10 56 h14 M10 67 h14 M10 78 h12" stroke="var(--red)" stroke-width="2.4" stroke-linecap="round" opacity=".45"/>
        </g>
        <path id="chev" d="M-5 3 L0 -3 L5 3" fill="none" stroke="var(--text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </defs>
      <rect width="200" height="200" rx="44" fill="var(--red)"/>
      <g class="s-drops" opacity=".7">
        <use href="#chev" x="46" y="36"/>
        <use href="#chev" x="150" y="44"/>
        <use href="#chev" x="164" y="80"/>
        <use href="#chev" x="30" y="72"/>
      </g>
      <g transform="translate(96 92) rotate(-10)">
        <path d="M-50 0 A50 50 0 0 1 50 0 Q41.7 -10 33.3 0 Q25 -10 16.7 0 Q8.3 -10 0 0 Q-8.3 -10 -16.7 0 Q-25 -10 -33.3 0 Q-41.7 -10 -50 0 Z" fill="var(--text)"/>
        <path d="M0 -50 V-58 M0 0 V56 A10 10 0 0 1 -20 56" fill="none" stroke="var(--text)" stroke-width="5" stroke-linecap="round"/>
      </g>
      <g class="s-finger">
        <g transform="translate(124 96) rotate(-8) scale(.72)">
          <use href="#hand"/>
        </g>
      </g>
    </svg>
    <p class="splash-name">Scrollbrella</p>
  </div>

  <main id="stage" aria-live="polite">
    <p id="prompt"></p>
  </main>

  <button id="music-toggle" aria-label="Play music" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18V6l10-2v12"/>
      <circle cx="6.5" cy="18" r="2.5"/>
      <circle cx="16.5" cy="16" r="2.5"/>
      <path class="mute-slash" d="M4 4l16 16"/>
    </svg>
  </button>
  <audio id="music" src="audio/gymnopedie-1.m4a" loop preload="none"></audio>

  <button id="edit-open" aria-label="Edit prompts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 20h4L19 9l-4-4L4 16v4z"/>
      <path d="M13.5 6.5l4 4"/>
    </svg>
  </button>

  <section id="editor" hidden aria-label="Edit prompts">
    <div class="editor-head">
      <h2>Your prompts</h2>
      <button id="cancel" class="btn">Cancel</button>
    </div>
    <p class="hint">One prompt per line. Copy all to back them up; paste text here to restore.</p>
    <textarea id="prompts-text" spellcheck="true" autocapitalize="sentences"></textarea>
    <div class="editor-actions">
      <button id="copy" class="btn">Copy all</button>
      <button id="restore" class="btn">Defaults</button>
      <span class="spacer"></span>
      <button id="done" class="btn primary">Done</button>
    </div>
    <p class="credits">Music: <i>Gymnopédie No. 1</i> by Erik Satie, performed by Robin Alciatore. Public domain, courtesy of Musopen.</p>
  </section>

  <script src="app.js"></script>
</body>
</html>
